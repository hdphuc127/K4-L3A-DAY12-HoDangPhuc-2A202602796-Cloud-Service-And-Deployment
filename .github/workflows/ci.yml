name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v -m "not docker" --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py
        env:
          AGENT_API_KEY: ${{ secrets.CI_AGENT_API_KEY }}
          REDIS_URL: fake://

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t day12-agent:ci .

  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Render
        run: |
          curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      - name: Wait for deployment
        run: sleep 30
      - name: Smoke test
        run: |
          curl --fail --retry 8 --retry-delay 10 --retry-connrefused "https://k4-l3a-day12-hodangphuc-2a202602796-ydt7.onrender.com/health"
          curl --fail --retry 8 --retry-delay 10 --retry-connrefused "https://k4-l3a-day12-hodangphuc-2a202602796-ydt7.onrender.com/ready"
